# Builda dist/spotify2soulseek.exe y lo publica como asset de un GitHub Release.
# Se dispara al pushear un tag "v*" (p.ej. v1.2.3) o manualmente indicando el
# tag. El exe empaquetado lleva APP_VERSION igual al tag, así que el
# self-update compara contra el release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión a publicar (p.ej. v1.2.3)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r config/requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download slskd for packaging
        run: python -c "from backend.bootstrap import download_slskd; download_slskd()"

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $version = "${env:TAG}" -replace '^v', ''
          Set-Content backend/version.py "APP_VERSION = `"$version`""
          Write-Host "Stamped APP_VERSION = $version"

      - name: Package executable
        run: python -m PyInstaller packaging/soulseek.spec --noconfirm --clean

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/spotify2soulseek.exe
          generate_release_notes: true
